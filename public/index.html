<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тигр и Евфрат</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap">
<style>
:root{--bg:#1b1713;--card:#2a2119;--line:#4a3b2b;--text:#e8dcc4;--muted:#a8987c;--gold:#e0b65a;--ok:#8fd19b;--bad:#ff9b7a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 0%,#3a2a17 0%,var(--bg) 65%) fixed,var(--bg);color:var(--text);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:48px 16px}
h1{font-family:Cinzel,Georgia,serif;color:var(--gold);font-size:32px;letter-spacing:.05em;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.row{display:flex;gap:12px;align-items:center;padding:8px 0}
.row+.row{border-top:1px dashed var(--line)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--muted);flex:none}
.ok .dot{background:var(--ok)}.bad .dot{background:var(--bad)}
.wait .dot{animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
p.note{margin:18px 0 0;color:var(--text)}
.tech{margin-top:14px;font-size:12px;color:var(--muted)}
button{margin-top:16px;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--gold);background:transparent;color:var(--gold);font:inherit;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>Тигр и Евфрат</h1>
  <p class="sub">Пробная страница нашего стола</p>
  <div class="card">
    <div class="row ok"><span class="dot"></span><span>Страница открылась</span></div>
    <div class="row wait" id="srv"><span class="dot"></span><span id="srvText">Проверяем сервер...</span></div>
  </div>
  <p class="note">Если обе строки зеленые, сайт у вас работает. Напишите Денису, с какого устройства вы зашли и через какой интернет: домашний Wi-Fi или мобильный.</p>
  <button id="again" type="button">Проверить еще раз</button>
  <div class="tech" id="tech"></div>
</main>
<script>
async function check() {
  const row = document.getElementById('srv'), text = document.getElementById('srvText'), tech = document.getElementById('tech');
  row.className = 'row wait'; text.textContent = 'Проверяем сервер...'; tech.textContent = '';
  const t0 = performance.now();
  try {
    const r = await fetch('/api/ping', { cache: 'no-store' });
    const d = await r.json();
    const ms = Math.round(performance.now() - t0);
    if (!r.ok || !d.ok || !d.smoke.valid) throw new Error('ответ ' + r.status);
    row.className = 'row ok';
    text.textContent = 'Сервер отвечает, ответ за ' + ms + ' мс';
    tech.textContent = 'регион ' + (d.region || 'локально') + ', движок ' + d.engine + ', тестовая партия движком за ' + d.smoke.ms + ' мс';
  } catch (e) {
    row.className = 'row bad';
    text.textContent = 'Сервер не ответил. Напишите Денису';
    tech.textContent = String(e.message || e);
  }
}
document.getElementById('again').addEventListener('click', check);
check();
</script>
</body>
</html>
